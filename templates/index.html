<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Comércio - Interface Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilos adicionais para a tabela de produtos */
        #productsTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            border-radius: 0.5rem; /* rounded-lg */
            overflow: hidden; /* Para que o border-radius funcione nas bordas da tabela */
        }
        #productsTable th, #productsTable td {
            padding: 0.75rem 1rem; /* py-3 px-4 */
            text-align: left;
            border-bottom: 1px solid #e5e7eb; /* gray-200 */
        }
        #productsTable th {
            background-color: #3b82f6; /* blue-500 */
            color: white;
            font-weight: 600; /* font-semibold */
            text-transform: uppercase;
            font-size: 0.875rem; /* text-sm */
            letter-spacing: 0.05em;
        }
        #productsTable tbody tr:nth-child(even) {
            background-color: #f9fafb; /* gray-50 */
        }
        #productsTable tbody tr:hover {
            background-color: #eff6ff; /* blue-50 */
        }
        #productsTable th:first-child { border-top-left-radius: 0.5rem; }
        #productsTable th:last-child { border-top-right-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-8">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-4xl w-full mx-4 mb-8">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-6">Bem-vindo à API do Comércio</h1>

        <h2 class="text-2xl font-semibold text-gray-700 mb-4 border-b pb-2">Login</h2>
        <div class="space-y-4 mb-8">
            <div>
                <label for="loginNome" class="block text-gray-700 text-sm font-bold mb-2">Nome de Usuário:</label>
                <input type="text" id="loginNome" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div>
                <label for="loginSenha" class="block text-gray-700 text-sm font-bold mb-2">Senha:</label>
                <input type="password" id="loginSenha" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <button onclick="realizarLogin()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline w-full transition duration-150 ease-in-out">Entrar</button>
            <p id="loginMensagem" class="text-center text-sm mt-2"></p>
        </div>

        <h2 class="text-2xl font-semibold text-gray-700 mb-4 border-b pb-2">Usuários</h2>
        <button onclick="carregarUsuarios()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out mb-4">Listar Usuários</button>
        <ul id="usuarios" class="list-disc list-inside text-gray-700 space-y-1 pl-4"></ul>

        <h2 class="text-2xl font-semibold text-gray-700 mt-8 mb-4 border-b pb-2">Produtos</h2>
        <button onclick="carregarProdutos()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out mb-4">Listar Produtos</button>
        
        <div id="produtos-container" class="overflow-x-auto">
            <table id="productsTable" class="min-w-full bg-white shadow-md rounded-lg">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Tamanho</th>
                        <th>Gênero</th>
                        <th>Cor</th>
                        <th>Preço</th>
                        <th>Quantidade</th> </tr>
                </thead>
                <tbody id="productsTableBody">
                    </tbody>
            </table>
            <p id="noProductsMessage" class="text-center text-gray-500 mt-4 hidden">Nenhum produto cadastrado.</p>
        </div>
    </div>

    <script>
        // Função para realizar o login
        async function realizarLogin() {
            const nomeUsuario = document.getElementById('loginNome').value;
            const senhaUsuario = document.getElementById('loginSenha').value;
            const loginMensagem = document.getElementById('loginMensagem');

            if (!nomeUsuario || !senhaUsuario) {
                loginMensagem.textContent = "Por favor, preencha o nome de usuário e a senha.";
                loginMensagem.className = "text-red-500 text-center text-sm mt-2";
                return;
            }

            try {
                const resposta = await fetch("/Login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        NomeUsuario: nomeUsuario,
                        SenhaUsuario: senhaUsuario
                    }),
                });

                const dados = await resposta.json();
                if (resposta.ok) {
                    loginMensagem.textContent = dados.mensagem;
                    loginMensagem.className = "text-green-500 text-center text-sm mt-2";
                } else {
                    loginMensagem.textContent = `Erro: ${dados.erro || "Ocorreu um erro desconhecido."}`;
                    loginMensagem.className = "text-red-500 text-center text-sm mt-2";
                }
            } catch (erro) {
                console.error("Erro na requisição de login:", erro);
                loginMensagem.textContent = "Não foi possível conectar ao servidor. Verifique se a API está rodando.";
                loginMensagem.className = "text-red-500 text-center text-sm mt-2";
            }
        }

        // Função para carregar usuários
        async function carregarUsuarios() {
            try {
                const resposta = await fetch("/CadastroUsuario");
                const dados = await resposta.json();
                const lista = document.getElementById("usuarios");
                lista.innerHTML = "";
                if (Array.isArray(dados)) {
                    if (dados.length === 0) {
                        lista.innerHTML = '<li class="text-gray-500">Nenhum usuário cadastrado.</li>';
                    } else {
                        dados.forEach(user => {
                            const li = document.createElement("li");
                            li.textContent = `Nome: ${user.NomeUsuario}, Setor: ${user.SetorUsuario}`;
                            lista.appendChild(li);
                        });
                    }
                } else {
                    lista.innerHTML = `<li class="text-red-500">Erro ao carregar usuários: ${dados.erro || 'Formato de dados inesperado.'}</li>`;
                }
            } catch (erro) {
                console.error("Erro ao carregar usuários:", erro);
                const lista = document.getElementById("usuarios");
                lista.innerHTML = '<li class="text-red-500">Não foi possível carregar os usuários. Verifique a API.</li>';
            }
        }

        // Função para carregar produtos e exibir em uma tabela
        async function carregarProdutos() {
            try {
                const resposta = await fetch("/CadastroProduto");
                const dados = await resposta.json();
                const productsTableBody = document.getElementById("productsTableBody");
                const noProductsMessage = document.getElementById("noProductsMessage");
                
                productsTableBody.innerHTML = ""; // Limpa o corpo da tabela

                if (Array.isArray(dados) && dados.length > 0) {
                    noProductsMessage.classList.add('hidden'); // Esconde a mensagem "Nenhum produto"
                    dados.forEach(prod => {
                        // console.log("Objeto produto recebido:", prod); // Mantido para depuração
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${prod.id !== undefined && prod.id !== null ? prod.id : 'N/A'}</td> <td>${prod.TipoProduto || 'N/A'}</td>
                            <td>${prod.Tamanho || 'N/A'}</td>
                            <td>${prod.Genero || 'N/A'}</td>
                            <td>${prod.Cor || 'N/A'}</td>
                            <td>R$ ${prod.Preco !== undefined && prod.Preco !== null ? prod.Preco.toFixed(2).replace('.', ',') : 'N/A'}</td>
                            <td>${prod.Quantidade !== undefined && prod.Quantidade !== null ? prod.Quantidade : 'N/A'}</td> `;
                        productsTableBody.appendChild(row);
                    });
                } else {
                    noProductsMessage.classList.remove('hidden'); // Mostra a mensagem "Nenhum produto"
                    noProductsMessage.textContent = 'Nenhum produto cadastrado.'; // Garante que a mensagem padrão seja exibida
                    noProductsMessage.classList.remove('text-red-500'); // Remove cor de erro, se houver
                }
            } catch (erro) {
                console.error("Erro ao carregar produtos:", erro);
                const productsTableBody = document.getElementById("productsTableBody");
                const noProductsMessage = document.getElementById("noProductsMessage");
                productsTableBody.innerHTML = ''; // Limpa a tabela
                noProductsMessage.classList.remove('hidden'); // Mostra a mensagem de erro
                noProductsMessage.textContent = 'Não foi possível carregar os produtos. Verifique a API.';
                noProductsMessage.classList.add('text-red-500');
            }
        }
    </script>
</body>
</html>
